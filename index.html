<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>NAŠE ŠIPKY – CRICKET</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f2f5ff;background:#101827}*{box-sizing:border-box}body{margin:0}main{max-width:950px;margin:auto;padding:16px 14px 50px}h1{font-size:25px;margin:8px 0 4px}h2{font-size:18px;margin:8px 0}p{color:#aebbd1;margin:5px 0 15px}.panel{background:#1b273b;border:1px solid #35445c;border-radius:16px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}label{display:block;font-size:13px;color:#bbc8df;margin-bottom:5px}input,select{width:100%;padding:12px 9px;border-radius:10px;border:1px solid #52617a;background:#101827;color:white;font-size:16px}input[type=color]{padding:3px;height:43px}button{border:1px solid #64758f;border-radius:11px;background:#2c3d58;color:white;padding:12px 9px;font-size:15px;font-weight:750;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35}button.primary{background:#d63c45;border-color:#f36b75}button.good{background:#20734c;border-color:#31b574}button:active{transform:scale(.98)}.playerSetup{display:grid;grid-template-columns:1fr 66px;gap:8px;margin:8px 0}.hidden{display:none!important}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}.player{border:2px solid var(--pc);border-radius:13px;padding:12px;background:#142034}.player.active{box-shadow:0 0 0 2px #fff6 inset;background:#24324a}.name{font-weight:800;font-size:19px}.score{font-size:27px;font-weight:900}.small{font-size:12px;color:#b8c6dc}.mark{font-size:20px;font-weight:800;letter-spacing:1px}.board{width:100%;border-collapse:collapse;text-align:center;table-layout:fixed}.board th,.board td{border-bottom:1px solid #3a4b62;padding:9px 2px;font-size:15px}.board th:first-child,.board td:first-child{width:48px}.board td{font-size:23px}.target{background:#30435c;border-radius:8px}.current{outline:2px solid #f5ca62;outline-offset:-2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.throw{min-height:72px;font-size:17px}.hint{font-size:13px;color:#b6c4d8}.banner{font-size:22px;font-weight:900;text-align:center;padding:14px;border:2px solid #e8c15b;border-radius:14px;background:#463c22}.chooser{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.chooser button.selected{background:#a34b36;border-color:#f2b276}.history{max-height:180px;overflow:auto;font-size:13px;color:#c5d0e2}.history div{padding:5px;border-bottom:1px solid #33435b}@media(max-width:480px){.four{grid-template-columns:repeat(2,1fr)}.name{font-size:16px}.board td{font-size:19px}.throw{font-size:14px;padding:8px 3px}.chooser{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main><h1>🎯 NAŠE ŠIPKY – CRICKET</h1><p>❤️ SÁJA × 💙 VOKUREK · 1–4 hráči</p><section id="setup" class="panel"><h2>Nová hra</h2><div class="grid"><div><label>Počet hráčů</label><select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div><div><label>První na řadě</label><select id="starter"></select></div></div><div id="playerInputs"></div><div class="grid"><div><label>Režim bodování</label><select id="mode"><option value="none">❤️ Bez bodů (naše klasika)</option><option value="standard">Body sobě – Standard</option><option value="cut">Body soupeřům – Cut-Throat</option></select></div><div><label>Pořadí terčů</label><select id="order"><option value="free">Bez pořadí</option><option value="bullup">Bull → 15 → 20</option><option value="bulldown">Bull → 20 → 15</option><option value="down">20 → 15 → Bull</option></select></div></div><p class="hint">V režimech s pořadím musí každý hráč nejprve uzavřít aktuální číslo. V bodovaných režimech se může vracet na dříve uzavřená čísla pro body.</p><button class="primary" id="start" style="width:100%">▶ ZAČÍT HRU</button></section><section id="game" class="hidden"><div id="winner" class="banner hidden"></div><div class="panel"><div id="players" class="players"></div><p id="turnInfo" style="margin-top:12px"></p></div><div class="panel"><h2>Uzavírání čísel</h2><div style="overflow:auto"><table class="board" id="board"></table></div></div><div class="panel"><h2 id="throwTitle">Zadej hod</h2><div id="chooseWrap" class="hidden"><label>Vyber číslo (bez pořadí / návrat pro body)</label><div id="chooser" class="chooser"></div></div><div id="throwButtons" class="three"></div><div class="actions" style="margin-top:9px"><button id="miss">✕ MIMO</button><button id="undo">↶ ZPĚT</button><button id="next">⇥ DALŠÍ HRÁČ</button></div><p class="hint" id="tip"></p></div><div class="panel"><div class="actions"><button id="restart">↻ NOVÁ HRA</button></div><h2>Historie hodů</h2><div id="history" class="history"></div></div></section></main><script>
'use strict';const $=id=>document.getElementById(id);const targets=[20,19,18,17,16,15,25];const defaults=[['SÁJA','#d63c45'],['VOKUREK','#2878d0'],['HRÁČ 3','#e2b445'],['HRÁČ 4','#49b68c']];let state=null,undoStack=[];const deep=x=>JSON.parse(JSON.stringify(x));const label=n=>n===25?'BULL':String(n);const sequence=order=>order==='bullup'?[25,15,16,17,18,19,20]:order==='bulldown'?[25,20,19,18,17,16,15]:[20,19,18,17,16,15,25];
function inputs(){let n=+$('count').value,old=Array.from($('playerInputs').querySelectorAll('.playerSetup')).map(r=>[r.querySelector('input[type=text]').value,r.querySelector('input[type=color]').value]);$('playerInputs').innerHTML='';for(let i=0;i<n;i++){let d=document.createElement('div');d.className='playerSetup';d.innerHTML=`<div><label>Hráč ${i+1}</label><input type="text" maxlength="20"></div><div><label>Barva</label><input type="color"></div>`;d.querySelector('[type=text]').value=old[i]?.[0]||defaults[i][0];d.querySelector('[type=color]').value=old[i]?.[1]||defaults[i][1];$('playerInputs').append(d)}starter()}
function starter(){let val=$('starter').value;$('starter').innerHTML='';Array.from($('playerInputs').querySelectorAll('.playerSetup')).forEach((r,i)=>{let o=new Option(r.querySelector('[type=text]').value||`Hráč ${i+1}`,i);$('starter').add(o)});if(val!==''&&+$('count').value>+val)$('starter').value=val}
$('count').onchange=inputs;$('playerInputs').addEventListener('input',e=>{if(e.target.type==='text')starter()});
function start(){let ps=Array.from($('playerInputs').querySelectorAll('.playerSetup')).map((r,i)=>({name:r.querySelector('[type=text]').value.trim()||`Hráč ${i+1}`,color:r.querySelector('[type=color]').value,marks:Object.fromEntries(targets.map(t=>[t,0])),score:0}));state={players:ps,mode:$('mode').value,order:$('order').value,turn:+$('starter').value,darts:0,selected:null,history:[],winner:null};undoStack=[];$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}
function nextTarget(p){return sequence(state.order).find(t=>p.marks[t]<3)??null}
function eligible(n){let p=state.players[state.turn];if(state.order==='free')return true;let next=nextTarget(p);if(next===null)return state.mode!=='none'&&p.marks[n]>=3;return n===next||(state.mode!=='none'&&p.marks[n]>=3&&sequence(state.order).indexOf(n)<sequence(state.order).indexOf(next))}
function canScore(n){return state.players.some((p,i)=>i!==state.turn&&p.marks[n]<3)}
function available(){return targets.filter(t=>eligible(t))}
function addHistory(s){state.history.unshift(s);if(state.history.length>120)state.history.pop()}
function saveUndo(){undoStack.push(deep(state));if(undoStack.length>100)undoStack.shift()}
function throwDart(mult,miss=false){if(!state||state.winner!==null)return;let n=state.selected; if(!miss&&(n===null||!eligible(n)))return;saveUndo();let p=state.players[state.turn],who=p.name;let points=0;if(!miss){let before=p.marks[n],newMarks=Math.min(3,before+mult),excess=Math.max(0,before+mult-3);p.marks[n]=newMarks;if(state.mode!=='none'&&excess>0&&canScore(n)){points=excess*(n===25?25:n);if(state.mode==='standard')p.score+=points;else state.players.forEach((other,i)=>{if(i!==state.turn&&other.marks[n]<3)other.score+=points})}addHistory(`${who}: ${n===25?(mult===2?'BULL 50':'BULL 25'):`${['','S','D','T'][mult]}${n}`} ${points?'· '+points+' bodů':''}`)}else addHistory(`${who}: MIMO`);state.darts++;
let finished=targets.every(t=>p.marks[t]===3);if(finished){if(state.mode==='none'||state.mode==='standard'&&state.players.every((other,i)=>i===state.turn||p.score>=other.score)||state.mode==='cut'&&state.players.every((other,i)=>i===state.turn||p.score<=other.score)){state.winner=state.turn;addHistory(`🏆 Vítěz: ${who}`)}}if(state.winner===null&&state.darts>=3)advance(false);render()}
function advance(record=true){if(!state||state.winner!==null)return;if(record)saveUndo();state.turn=(state.turn+1)%state.players.length;state.darts=0;state.selected=null;if(record)addHistory('— Další hráč —');}
function undo(){if(!undoStack.length)return;state=undoStack.pop();render()}
function select(n){if(!eligible(n))return;state.selected=n;render()}
function render(){let p=state.players[state.turn],avail=available();if(!avail.includes(state.selected))state.selected=null;if(state.selected===null&&avail.length===1)state.selected=avail[0];$('winner').classList.toggle('hidden',state.winner===null);if(state.winner!==null)$('winner').textContent='🏆 VYHRÁVÁ '+state.players[state.winner].name+'!';$('players').innerHTML=state.players.map((x,i)=>`<div class="player ${i===state.turn?'active':''}" style="--pc:${x.color}"><div class="name" style="color:${x.color}">${escapeHtml(x.name)}</div><div class="small">${i===state.turn?'🎯 NA ŘADĚ':'Hráč '+(i+1)}</div>${state.mode!=='none'?`<div class="score">${x.score} <span class="small">bodů</span></div>`:''}<div class="small">Uzavřeno: ${targets.filter(t=>x.marks[t]===3).length}/7</div></div>`).join('');$('turnInfo').textContent=`${p.name} · šipka ${Math.min(3,state.darts+1)} ze 3 · ${state.mode==='none'?'bez bodů':state.mode==='standard'?'body sobě':'body soupeřům'}`;
$('board').innerHTML='<thead><tr><th>Terč</th>'+state.players.map(x=>`<th style="color:${x.color}">${escapeHtml(x.name)}</th>`).join('')+'</tr></thead><tbody>'+targets.map(t=>`<tr><th>${label(t)}</th>`+state.players.map((x,i)=>{let m=x.marks[t],sym=['·','╱','✕','⊗'][m];return `<td class="${i===state.turn&&t===state.selected?'current ':''}${i===state.turn&&eligible(t)?'target':''}" style="color:${x.color}">${sym}</td>`}).join('')+'</tr>').join('')+'</tbody>';
let choice=state.order==='free'||avail.length>1;$('chooseWrap').classList.toggle('hidden',!choice);$('chooser').innerHTML=avail.map(t=>`<button class="${state.selected===t?'selected':''}" data-n="${t}">${label(t)}</button>`).join('');$('chooser').querySelectorAll('button').forEach(b=>b.onclick=()=>select(+b.dataset.n));let n=state.selected;$('throwTitle').textContent=n===null?'Vyber terč':`Zadej hod: ${label(n)}`;let labels=n===25?[['BULL 25',1],['BULL 50',2]]:n===null?[]:[[`SINGLE ${n}`,1],[`DOUBLE ${n}`,2],[`TRIPLE ${n}`,3]];$('throwButtons').style.gridTemplateColumns=`repeat(${Math.max(labels.length,1)},minmax(0,1fr))`;$('throwButtons').innerHTML=labels.map(([l,m])=>`<button class="throw good" data-m="${m}" ${state.winner!==null?'disabled':''}>${l}</button>`).join('');$('throwButtons').querySelectorAll('button').forEach(b=>b.onclick=()=>throwDart(+b.dataset.m));$('miss').disabled=state.winner!==null;$('next').disabled=state.winner!==null;$('undo').disabled=!undoStack.length;$('tip').textContent=state.order==='free'?'Terče lze zavírat v libovolném pořadí.':state.mode==='none'?'Nejdřív uzavři aktuální terč.':'Zavírej terče postupně; k uzavřeným se můžeš vrátit pro body, pokud je soupeř ještě nemá uzavřené.';$('history').innerHTML=state.history.map(h=>`<div>${escapeHtml(h)}</div>`).join('')||'<div>Zatím žádné hody.</div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('start').onclick=start;$('miss').onclick=()=>throwDart(0,true);$('next').onclick=()=>{advance();render()};$('undo').onclick=undo;$('restart').onclick=()=>{if(confirm('Opravdu ukončit tuto hru a začít novou?')){$('game').classList.add('hidden');$('setup').classList.remove('hidden');state=null;undoStack=[]}};inputs();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
